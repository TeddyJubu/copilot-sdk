# Gitleaks configuration for yourgpt-copilot SDK
# Scan documentation and example files too: placeholders do not exempt a file.

title = "Gitleaks config for yourgpt-copilot"

# Use all default secret detection rules
[extend]
useDefault = true

# Block private environment files. Template names are allowed for this rule
# only; their contents are still checked by every credential detection rule.
[[rules]]
id = "env-files-blocker"
description = "Block private environment files from being committed"
regex = '''.+'''
path = '''(^|/)(\.env($|\.)|\.dev\.vars$)'''
tags = ["env", "config"]

[[rules.allowlists]]
description = "Environment templates remain subject to credential scanning"
paths = [
    '''(^|/)\.env(\.[^/]+)?\.example$''',
    '''(^|/)\.dev\.vars\.example$''',
]

# Include modern provider key formats alongside Gitleaks' built-in rules.
[[rules]]
id = "provider-api-key"
description = "OpenAI, Anthropic, or OpenRouter API key"
regex = '''\bsk-(?:proj-|ant-(?:api\d+-|usr-)?|or-v1-)?[A-Za-z0-9_-]{24,}'''
tags = ["api-key", "provider"]
